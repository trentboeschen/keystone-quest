<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keystone Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b8352a">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keystone Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: grown-up historical adventure; serious, warm, never babyish
   IDEA: an excavation field notebook: scenes read like journal pages, facts like museum labels
   PICTURE: each adventure's painted scene band above the story; the typed choices are the tool
   COLOUR and TYPE: limestone ground, basalt ink, one accent per adventure (fresco red, faience teal); Cinzel inscriptions, Atkinson Hyperlegible text and mono
   LAYOUT: library of adventure cards + player panel; play column (scene, story, choices, keyboard); editor two panes */
:root{color-scheme:light dark;--bg:light-dark(#ebe9e4,#151614);--panel:light-dark(#fbfaf7,#20221f);--ink:light-dark(#1c1d1b,#ebeae4);--mute:light-dark(#5d605a,#a2a59d);--line:light-dark(#d3d0c9,#363934);--acc:#b8352a;--good:light-dark(#2d7a4c,#5fbf86);--mix:light-dark(#9a6a0c,#e0b04a);--bad:light-dark(#b0322a,#ef7a6e);--f1:#9a6fc0;--f2:#3f84c4;--f3:#3f9a63;--f4:#d1912c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:800;line-height:1.08;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 16px;min-height:44px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.ghost{background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;font-size:16px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:max(12px,env(safe-area-inset-top)) max(4vw,16px,env(safe-area-inset-right)) 12px max(4vw,16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:Cinzel,serif;font-weight:800;font-size:22px;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand svg{width:28px;height:28px}
.top select{width:auto;min-height:44px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,3vw,40px) max(4vw,16px)}
.lib{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px}
.hero h1{font-size:clamp(32px,4.5vw,50px)}
.hero p{color:var(--mute);max-width:62ch;margin:10px 0 24px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .art{height:150px}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.era{font-size:14px;color:var(--mute)}
.card h3{font-size:22px}
.card p{margin:0;color:var(--mute);font-size:15px;flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .row{margin-top:10px}
.draft{font-size:13px;font-weight:700;color:var(--mix);margin-top:8px}
label.pub{display:flex;gap:10px;align-items:center;color:var(--ink);font-weight:700;font-size:16px;margin:4px 0 6px;min-height:44px;cursor:pointer}
label.pub input{width:22px;height:22px;accent-color:var(--acc)}
input[readonly]{opacity:.7}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.medal{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.medal svg{flex:none}.medal strong{display:block;font-size:15px}.medal span{display:block;font-size:13px;color:var(--mute);line-height:1.35}.medal em{display:block;font-size:12px;color:var(--mute);font-style:normal;margin-top:2px}
.medal.locked strong{color:var(--mute)}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 18px 12px 12px;max-width:min(440px,calc(100vw - 24px));box-shadow:0 10px 30px rgb(0 0 0/.3);transition:transform .35s;z-index:20;pointer-events:none}
#toast.show{transform:translate(-50%,0)}#toast strong{display:block}#toast span{display:block;font-size:14px;opacity:.8}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.newcard{border-style:dashed;align-items:center;justify-content:center;min-height:260px;text-align:center;padding:20px;gap:10px}
.art svg{display:block;width:100%;height:100%}
.side{display:flex;flex-direction:column;gap:18px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.box h3{font-size:18px;margin-bottom:8px}
.small{font-size:14px;color:var(--mute)}
.tk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tk span{font-family:"Atkinson Hyperlegible Mono",monospace;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:15px}
.tk b{color:var(--bad);font-weight:600;font-size:13px;margin-left:4px}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-weight:700}
details li{font-size:14px;margin:6px 0;color:var(--mute)}
/* play */
.play{max-width:860px;margin:0 auto;padding:0 max(3vw,12px) 40px}
.scene-art{height:clamp(130px,24vw,220px);border-radius:0 0 16px 16px;overflow:hidden}
.ptop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 6px}
.ptop h2{font-size:clamp(22px,3vw,30px);margin-right:auto}
.meter{display:flex;gap:16px;font-size:15px;color:var(--mute)}
.meter b{color:var(--ink);font-variant-numeric:tabular-nums}
.timer{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;background:var(--acc);width:100%}
.story{font-size:clamp(18px,2vw,20px);line-height:1.6;margin:14px 0}
.story p{margin:0 0 12px;max-width:66ch}
.note{border-left:4px solid var(--acc);background:var(--panel);padding:12px 16px;border-radius:0 10px 10px 0;font-size:16px;max-width:66ch}
.note strong{font-family:Cinzel,serif;display:block;font-size:14px;margin-bottom:2px}
.prompt{font-size:14px;color:var(--mute);margin:20px 0 8px}
.choices{display:flex;flex-direction:column;gap:10px}
#ti{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0;pointer-events:none}
.tapkb{width:100%;margin-top:12px;font-weight:700;border-style:dashed;min-height:52px}
.pmsg{color:var(--bad);font-weight:700;margin-left:8px}
.kbtip{display:none}
.ch{-webkit-user-select:none;user-select:none;font-family:"Atkinson Hyperlegible Mono",monospace;font-size:clamp(19px,2.6vw,25px);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 18px;transition:opacity .15s,border-color .15s;white-space:pre-wrap;word-break:break-word}
.ch .t{color:var(--acc);font-weight:600}
.ch .n{border-bottom:3px solid var(--acc)}
.ch.on{border-color:var(--acc)}
.ch.off{opacity:.32}
.ch.done{background:var(--acc);color:#fff;border-color:var(--acc)}
.ch.done .t{color:#fff}
.shake{animation:sh .25s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.badge{display:inline-block;font-weight:700;font-size:14px;border-radius:999px;padding:4px 12px;color:#fff}
.b-good{background:var(--good)}.b-mixed{background:var(--mix)}.b-bad{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stats b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--mute)}
.kb{margin:26px auto 0;display:flex;flex-direction:column;gap:6px;align-items:center;user-select:none}
.kr{display:flex;gap:6px}
.k{width:clamp(26px,6.2vw,46px);height:clamp(30px,6.2vw,44px);border-radius:7px;display:grid;place-items:center;font-family:"Atkinson Hyperlegible Mono",monospace;font-size:clamp(13px,1.8vw,17px);background:var(--panel);border:1px solid var(--line);border-bottom:4px solid var(--fc);position:relative}
.k.hot{background:var(--fc);color:#fff;transform:translateY(-2px)}
.k.bump::after{content:"";position:absolute;bottom:4px;width:10px;height:2px;background:currentColor;opacity:.6}
.k.weak::before{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.k.space{width:clamp(160px,40vw,300px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.warn{background:var(--panel);border:1px solid var(--mix);border-radius:10px;padding:10px 14px;font-size:15px;margin-top:12px}
/* editor */
.edbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.edbar h2{font-size:clamp(22px,3vw,30px);margin-right:auto}
.ed{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
.slist{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:420px;overflow:auto}
.slist button{text-align:left;display:flex;justify-content:space-between;gap:8px;min-height:40px;padding:8px 12px;font-family:"Atkinson Hyperlegible Mono",monospace;font-size:15px}
.slist button.sel{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;align-self:center}
.chrow{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) auto;gap:8px;align-items:end}
.chrow .adv{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chrow label{margin-top:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.issues li{font-size:14px;margin:6px 0;cursor:pointer}
.saved{font-size:14px;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgb(0 0 0/.45);display:grid;place-items:center;padding:16px;z-index:9}
.modal .box{width:min(760px,100%);max-height:90vh;overflow:auto}
.modal textarea{min-height:240px;font-family:"Atkinson Hyperlegible Mono",monospace;font-size:13px}
@media(max-width:900px){.lib,.ed{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3,.chrow,.chrow .adv{grid-template-columns:minmax(0,1fr)}.k{width:calc((100vw - 90px)/11)}}
body.softkb .play{position:fixed;left:0;right:0;top:var(--vvt,0);height:var(--vvh,100vh);max-width:none;margin:0;padding:8px max(12px,env(safe-area-inset-left)) 8px max(12px,env(safe-area-inset-right));display:flex;flex-direction:column;background:var(--bg);z-index:8}
body.softkb .pscroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
body.softkb .pdock{flex:none;border-top:1px solid var(--line);padding-top:6px}
body.softkb .scene-art,body.softkb .kb,body.softkb .legend,body.softkb .warn,body.softkb .tapkb{display:none}
body.softkb .ptop{margin:2px 0}body.softkb .ptop h2{font-size:19px}body.softkb .ptop .ghost{min-height:36px;padding:6px 10px}
body.softkb .story{font-size:17px;margin:6px 0}body.softkb .prompt{margin:6px 0 4px}
body.softkb .ch{padding:8px 12px;font-size:18px}body.softkb .choices{gap:6px}
body.softkb .kbtip{display:inline}
@media(prefers-reduced-motion:reduce){.shake{animation:none}.k.hot{transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 28 L4 14 Q16 0 28 14 L28 28 L21 28 L21 17 Q16 11 11 17 L11 28Z" fill="var(--acc)"/><path d="M12.6 5.6 h6.8 l-1.4 8.6 h-4z" fill="currentColor"/></svg>Keystone Quest</div>
  <select id="player" aria-label="Player"></select>
  <button class="ghost" data-act="sound" id="soundBtn">Sound on</button>
  <button class="ghost" data-act="library">Adventures</button>
  <button class="ghost" data-act="signIn" id="editBtn">Editor</button>
</header>
<main id="app"></main>
<div id="modal"></div>
<input id="ti" type="text" value="##" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" enterkeyhint="done" aria-label="Type your choice here">
<div id="toast" role="status" aria-live="polite"></div>
<script>
{
const ARTS={none:"Plain",volcano:"Volcano",desert:"Desert valley",castle:"Castle",sea:"Sea voyage"};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const app=$("#app"),ti=$("#ti");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));
const rid=()=>Math.random().toString(36).slice(2,7);
const list=s=>String(s||"").split(",").map(t=>t.trim().toLowerCase()).filter(Boolean);
const slug=s=>String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

/* ---------- scene art ---------- */
function art(kind,acc){
  let r=n=>{let x=Math.sin(n*99.1)*1e4;return x-Math.floor(x)};
  if(kind==="volcano"){
    let cols="";for(let i=0;i<9;i++)cols+=`<rect x="${60+i*22}" y="170" width="9" height="42" fill="#d8c7ac"/>`;
    let ash="";for(let i=0;i<70;i++)ash+=`<circle cx="${(r(i)*800).toFixed(0)}" cy="${(r(i+7)*220).toFixed(0)}" r="${(1+r(i+3)*2.2).toFixed(1)}" fill="#2a2627" opacity=".55"/>`;
    let puff="";[[520,58,62],[468,72,44],[575,70,48],[500,30,40],[548,28,42],[430,92,30],[612,96,34]].forEach(([x,y,s],i)=>puff+=`<circle cx="${x}" cy="${y}" r="${s}" fill="${i%2?"#4b4446":"#5a5254"}"/>`);
    return `<svg viewBox="0 0 800 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c3537"/><stop offset=".55" stop-color="#9b5236"/><stop offset="1" stop-color="#e6a463"/></linearGradient></defs><rect width="800" height="240" fill="url(#gv)"/><path d="M505 130 C500 100 510 80 512 60 L530 60 C532 80 542 100 536 130Z" fill="#4b4446"/>${puff}<path d="M280 240 L465 128 Q520 110 575 128 L800 240Z" fill="#2a2425"/><path d="M465 128 Q520 110 575 128" stroke="#ff7a3c" stroke-width="3" fill="none" opacity=".8"/><rect y="208" width="800" height="32" fill="#1c1919"/><path d="M48 170 L170 140 L292 170Z" fill="#d8c7ac"/>${cols}<rect x="48" y="206" width="244" height="6" fill="#bda98b"/>${ash}</svg>`}
  if(kind==="desert"){
    return `<svg viewBox="0 0 800 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc0d4"/><stop offset="1" stop-color="#f1d49b"/></linearGradient></defs><rect width="800" height="240" fill="url(#gd)"/><circle cx="660" cy="58" r="30" fill="#fff4d8"/><path d="M0 120 L90 70 L170 98 L260 52 L360 96 L470 60 L560 100 L660 74 L800 110 L800 240 L0 240Z" fill="#c98c4e"/><path d="M0 150 L120 112 L230 140 L330 110 L440 146 L560 118 L700 150 L800 132 L800 240 L0 240Z" fill="#a9673a"/><path d="M0 196 Q400 176 800 200 L800 240 L0 240Z" fill="#dcab6a"/><rect x="372" y="150" width="56" height="10" fill="#7c4a28"/><rect x="380" y="160" width="40" height="44" fill="#26180f"/>${[0,1,2,3].map(i=>`<rect x="${372-i*8}" y="${204+i*6}" width="${56+i*16}" height="5" fill="#c4935a"/>`).join("")}<rect x="250" y="176" width="40" height="22" fill="#b98754"/><rect x="510" y="180" width="34" height="18" fill="#b98754"/></svg>`}
  if(kind==="castle"){
    let cren="";for(let i=0;i<10;i++)cren+=`<rect x="${330+i*16}" y="96" width="9" height="12" fill="#3b3c43"/>`;
    return `<svg viewBox="0 0 800 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93aebf"/><stop offset="1" stop-color="#e3e6dc"/></linearGradient></defs><rect width="800" height="240" fill="url(#gc)"/><path d="M0 170 Q200 120 400 150 T800 140 L800 240 L0 240Z" fill="#6e8a57"/><rect x="330" y="108" width="150" height="80" fill="#3b3c43"/>${cren}<rect x="300" y="70" width="40" height="118" fill="#2f3036"/><rect x="470" y="70" width="40" height="118" fill="#2f3036"/><path d="M296 70 L320 40 L344 70Z M466 70 L490 40 L514 70Z" fill="${acc}"/><path d="M390 188 L390 150 Q405 134 420 150 L420 188Z" fill="#1d1d21"/><path d="M0 200 Q300 170 800 205 L800 240 L0 240Z" fill="#4c6a3c"/></svg>`}
  if(kind==="sea"){
    let w="";for(let i=0;i<6;i++)w+=`<path d="M0 ${150+i*16} q50 -10 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0" stroke="#bfe0ea" stroke-width="2" fill="none" opacity="${.5-i*.06}"/>`;
    return `<svg viewBox="0 0 800 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="800" height="240" fill="#c9d8de"/><rect y="140" width="800" height="100" fill="#2f5f73"/>${w}<path d="M330 150 L470 150 L450 172 L350 172Z" fill="#5a3a24"/><rect x="398" y="60" width="5" height="90" fill="#3a2516"/><path d="M403 66 Q450 100 403 140Z" fill="#f2ead8"/><path d="M398 70 Q360 104 398 136Z" fill="${acc}"/></svg>`}
  return `<svg viewBox="0 0 800 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="800" height="240" fill="${acc}"/><rect width="800" height="240" fill="#000" opacity=".25"/><path d="M0 180 Q400 120 800 180 L800 240 L0 240Z" fill="#000" opacity=".2"/></svg>`;
}

/* ---------- players, stats, storage ---------- */
let players=ls.get("ks-players",["Player 1"]);let cur=ls.get("ks-cur",players[0]);if(!players.includes(cur))cur=players[0];
let stats=ls.get("ks-stats",{});
const ps=()=>{const p=stats[cur]||(stats[cur]={});["keys","facts","endings","scores","saves"].forEach(k=>{if(!p[k]||typeof p[k]!=="object")p[k]={}});return p};
const saveStats=()=>ls.set("ks-stats",stats);
/* overall typing speed across all play: correct keystrokes and active typing time */
const typing=()=>{const P=ps();if(!P.typing||typeof P.typing!=="object")P.typing={chars:0,ms:0};return P.typing};
const overallWpm=()=>{const t=typing();return t.ms>3000?Math.round(t.chars/5/(t.ms/60000)):0};
/* Difficulty scales every timed scene. Adventures are written with Normal timings. */
const DIFF={untimed:{label:"No timers",mult:0,note:"Timed scenes wait for you."},relaxed:{label:"Relaxed",mult:1.5,note:"Timers run 50% longer."},normal:{label:"Normal",mult:1,note:"Timers as the adventure was written."},challenge:{label:"Challenging",mult:.7,note:"Timers are 30% shorter."},expert:{label:"Expert",mult:.5,note:"Timers are half as long."}};
const diffKey=()=>DIFF[ps().difficulty]?ps().difficulty:"normal";
const timerSecs=s=>{if(!s||s.ending||!(+s.timer>0)||!s.timeout)return 0;const m=DIFF[diffKey()].mult;return m?Math.max(3,Math.round(+s.timer*m)):0};
let sound=ls.get("ks-sound",true);

/* ---------- adventures live on the server: adventures/*.json, read and written through api.php ---------- */
let ADVS=[],loadState="loading",loadErr="",isEditor=false,editingOn=true;

async function loadAdventures(){

const ROWS=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l",";","'"],["z","x","c","v","b","n","m",",",".","/"]];

  if(resume&&adv.scenes[resume.scene]){G.flags=new Set(resume.flags||[]);G.hits=+resume.hits||0;G.misses=+resume.misses||0;G.ms=+resume.ms||0;G.notes=+resume.notes||0;G.hwKeys=+resume.hwKeys||0;G.touchKeys=+resume.touchKeys||0;return go(resume.scene,true)}
  go(sceneId||adv.start)}
function sc(){return G.adv.scenes[G.scene]}
function go(id,resumed){
  G.scene=id;G.buf="";G.t0=0;G.token++;G.locked=false;G.h0=G.hits;
  const s=sc(),aid=G.adv.id;
  if(s&&s.fact&&!resumed)G.notes++;

    const day=new Date().toLocaleDateString("en-CA");if(!P.days.includes(day)){P.days.push(day);if(P.days.length>400)P.days.shift()}
    if(s.fact){P.facts[aid]=P.facts[aid]||[];if(!P.facts[aid].includes(id))P.facts[aid].push(id)}
    if(s.ending){P.endings[aid]=P.endings[aid]||[];if(!P.endings[aid].includes(id))P.endings[aid].push(id);
      if(!resumed){P.scores[aid]=P.scores[aid]||[];P.scores[aid].push({t:Date.now(),ending:s.ending,scene:id,acc:acc(),wpm:wpm(),diff:diffKey(),input:G.touchKeys>G.hwKeys?"touch":"keyboard"});if(P.scores[aid].length>50)P.scores[aid].shift()}
      delete P.saves[aid]}
    else P.saves[aid]={scene:id,flags:[...G.flags],hits:G.hits,misses:G.misses,ms:Math.round(G.ms),wpm:wpm(),acc:acc(),notes:G.notes,hwKeys:G.hwKeys,touchKeys:G.touchKeys,t:Date.now()};

    const loop=()=>{if(tok!==G.token||view!=="play")return;const left=end-performance.now();const bar=$("#tbar");if(bar)bar.style.width=Math.max(0,left/dur*100)+"%";
      if(left<=0){if(G.t0)G.ms+=performance.now()-G.t0;beep(false);go(s.timeout);return}requestAnimationFrame(loop)};requestAnimationFrame(loop)}
}
function visible(){

function acc(){const t=G.hits+G.misses;return t?Math.round(100*G.hits/t):100}

function importAdv(txt){
  let a;try{a=JSON.parse(txt)}catch(e){return "That isn't valid adventure JSON."}
  if(!a||typeof a!=="object"||!a.scenes||typeof a.scenes!=="object"||!a.start)return "That file is missing scenes or a starting scene.";
  a.title=a.title||"Imported adventure";
  a.id=validId(a.id||"")&&!findAdv(a.id)?a.id:freeId(a.title);
  a.published=false;delete a.updated;Object.values(a.scenes).forEach(s=>{s.choices=Array.isArray(s.choices)?s.choices:[]});
  closeModal();openEditor(a,true);return null;
}

/* ---------- player data backup ---------- */
function backup(){return{app:"keystone",kind:"player-data",version:1,exported:new Date().toISOString(),players,current:cur,sound,stats}}
function mergeStats(a,b){/* combine two copies of one player's data, keeping the most complete of each part */
  const o={keys:{},facts:{},endings:{},scores:{},saves:{},difficulty:a.difficulty||b.difficulty};
  const ba=a.badges||{},bb=b.badges||{};o.badges={};new Set([...Object.keys(ba),...Object.keys(bb)]).forEach(k=>o.badges[k]=Math.min(ba[k]||Infinity,bb[k]||Infinity));
  const ca=a.counts||{},cb=b.counts||{};o.counts={};new Set([...Object.keys(ca),...Object.keys(cb)]).forEach(k=>o.counts[k]=Math.max(ca[k]||0,cb[k]||0));
  o.days=[...new Set([...(a.days||[]),...(b.days||[])])].sort().slice(-400);
  const ta=a.typing||{chars:0,ms:0},tb=b.typing||{chars:0,ms:0};o.typing=(ta.chars||0)>=(tb.chars||0)?ta:tb;
  const ka=a.keys||{},kb=b.keys||{};new Set([...Object.keys(ka),...Object.keys(kb)]).forEach(k=>{const x=ka[k]||[0,0],y=kb[k]||[0,0];o.keys[k]=x[0]+x[1]>=y[0]+y[1]?x:y});
  ["facts","endings"].forEach(f=>{const A=a[f]||{},B=b[f]||{};new Set([...Object.keys(A),...Object.keys(B)]).forEach(id=>o[f][id]=[...new Set([...(A[id]||[]),...(B[id]||[])])])});
  const SA=a.scores||{},SB=b.scores||{};new Set([...Object.keys(SA),...Object.keys(SB)]).forEach(id=>{const m=new Map;[...(SA[id]||[]),...(SB[id]||[])].forEach(r=>m.set(r.t+"|"+r.scene,r));o.scores[id]=[...m.values()].sort((x,y)=>x.t-y.t).slice(-50)});
  const VA=a.saves||{},VB=b.saves||{};new Set([...Object.keys(VA),...Object.keys(VB)]).forEach(id=>{const x=VA[id],y=VB[id];o.saves[id]=!x?y:!y?x:(x.t||0)>=(y.t||0)?x:y});
  return o;
}
function applyData(d,mode){
  if(!d||d.app!=="keystone"||!d.stats||typeof d.stats!=="object"||!Array.isArray(d.players))return "That isn't a Keystone Quest data file.";
  const inPlayers=d.players.filter(p=>typeof p==="string"&&p.trim());
  if(mode==="replace"){players=inPlayers.length?inPlayers:["Player 1"];stats=d.stats;cur=players.includes(d.current)?d.current:players[0];if(typeof d.sound==="boolean")sound=d.sound}
  else{inPlayers.forEach(p=>{if(!players.includes(p))players.push(p);stats[p]=stats[p]?mergeStats(stats[p],d.stats[p]||{}):d.stats[p]||{}})}
  ls.set("ks-players",players);ls.set("ks-cur",cur);ls.set("ks-stats",stats);ls.set("ks-sound",sound);
  return null;
}

/* ---------- clicks ---------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act,id=el.dataset.id;
  if(act==="closeBg"&&e.target!==el)return;
  switch(act){
    case "library":saveStats();if(view==="editor"&&E&&E.dirty)return confirmBox("Leave the editor?","You have unsaved changes.","discard","Leave without saving");return renderLibrary();
    case "discard":closeModal();E.dirty=false;return renderLibrary();
    case "sound":sound=!sound;ls.set("ks-sound",sound);return renderPlayers();
    case "play":return play(findAdv(id));
    case "resume":return play(findAdv(id),null,false,ps().saves[id]);
    case "dataOut":return download("keystone-quest-data-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(backup(),null,2));
    case "dataIn":modal(`<h3>Import player data</h3><p class="small">Choose a Keystone Quest data file, or paste its text.</p><input type="file" accept=".json,application/json" id="impFile"><textarea id="impTxt" style="margin-top:10px" placeholder="Paste here"></textarea>
      <label><input type="radio" name="imode" value="merge" checked style="width:auto;margin-right:8px">Merge with the players already here</label><label><input type="radio" name="imode" value="replace" style="width:auto;margin-right:8px">Replace everything in this browser</label>
      <div class="row" style="margin-top:12px"><button class="pri" data-act="dataGo">Import</button><button data-act="close">Cancel</button><span class="small" id="impMsg"></span></div>`);
      $("#impFile").addEventListener("change",ev=>{const f=ev.target.files[0];if(f)f.text().then(t=>{$("#impTxt").value=t})});return;
    case "dataGo":{let d;try{d=JSON.parse($("#impTxt").value)}catch(x){$("#impMsg").textContent="That isn't valid data.";return}
      const mode=(document.querySelector("input[name=imode]:checked")||{}).value;
      if(mode==="replace"&&!el.dataset.sure){el.dataset.sure="1";el.textContent="Yes, replace everything";$("#impMsg").textContent="This erases the current profiles in this browser.";return}
      const err=applyData(d,mode);if(err){$("#impMsg").textContent=err;return}
      closeModal();renderPlayers();return renderLibrary()}
    case "copy":{const a=clone(findAdv(id));a.title+=" (copy)";a.id=freeId(a.title);a.published=false;delete a.updated;return openEditor(a,true)}
    case "edit":return openEditor(findAdv(id));
    case "badges":return badgeGallery();
    case "showkb":return focusTyping();
    case "hintOff":ls.set("ksq-hint-off",true);return renderLibrary();
    case "reload":loadState="loading";renderLibrary();await loadAdventures();return renderLibrary();
    case "signIn":return signIn(()=>{if(view==="library")renderLibrary()});
    case "signInGo":{const k=$("#ek").value;if(!k)return;editKey=k;try{await api("auth");ls.set("ksq-key",k);closeModal();await loadAdventures();const f=window._afterSignIn;window._afterSignIn=null;if(view==="library")renderLibrary();if(f)f()}catch(x){editKey="";$("#ekMsg").textContent=x.status===401?"That password isn't right.":x.message}return}
    case "signOut":if(view==="editor"&&E&&E.dirty)return confirmBox("Sign out of editing?","You have unsaved changes.","signOutYes","Sign out without saving");
    case "signOutYes":closeModal();editKey="";isEditor=false;ls.set("ksq-key","");await loadAdventures();return renderLibrary();
    case "forceSave":closeModal();return saveToServer(window._conflict);
    case "loadServer":closeModal();await loadAdventures();{const a=findAdv(E.adv.id);E.dirty=false;return a?openEditor(a):renderLibrary()}
    case "new":if(!isEditor)return signIn(()=>openEditor(newAdv(),true));if(view==="editor"&&E&&E.dirty)return confirmBox("Start a new adventure?","You have unsaved changes in this one.","newForce","Discard and start new");return openEditor(newAdv(),true);
    case "newForce":closeModal();return openEditor(newAdv(),true);
    case "pick":if(id){E.sel=id;renderEditor()}return;
    case "addScene":E.sel=addScene();dirty();return renderEditor();
    case "addChoice":E.adv.scenes[E.sel].choices.push({text:"",next:""});dirty();renderEditor();{const ins=document.querySelectorAll("[data-c$=':text']");if(ins.length)ins[ins.length-1].focus()}return;
    case "delChoice":E.adv.scenes[E.sel].choices.splice(+el.dataset.i,1);dirty();return renderEditor();
    case "delScene":if(Object.keys(E.adv.scenes).length<2)return;return confirmBox("Delete this scene?",`“${E.sel}” will be removed. Choices that led here will need a new destination.`,"delSceneYes","Delete scene");
    case "delSceneYes":delete E.adv.scenes[E.sel];if(E.adv.start===E.sel)E.adv.start=Object.keys(E.adv.scenes)[0];closeModal();dirty();return renderEditor();
    case "test":E.returnTo=E.sel;return play(clone(E.adv),id,true);
    case "backEdit":return renderEditor();
    case "save":return saveToServer();
    case "leaveEd":if(E.dirty)return confirmBox("Leave the editor?","You have unsaved changes.","discard","Leave without saving");return renderLibrary();
    case "delAdv":if(E.isNew){return confirmBox("Discard this adventure?","It hasn't been saved to the server yet.","discard","Discard")}return confirmBox("Delete this adventure?",`“${E.adv.title}” will be removed from the game. A copy is kept on the server in adventures/_backups/.`,"delAdvYes","Delete adventure");
    case "delAdvYes":try{await api("delete",{id:E.adv.id});ADVS=ADVS.filter(a=>a.id!==E.adv.id);closeModal();E.dirty=false;return renderLibrary()}catch(x){closeModal();const m=$("#savedMsg");if(m)m.textContent="Not deleted: "+x.message;return}
    case "export":return download((E.adv.id||"adventure")+".json",JSON.stringify(E.adv,null,2));
    case "import":modal(`<h3>Import an adventure</h3><p class="small">Choose an exported .json file, or paste its text. It opens in the editor as an unpublished draft until you save and publish it.</p><input type="file" accept=".json,application/json" id="impFile"><textarea id="impTxt" style="margin-top:10px" placeholder="Paste here"></textarea><div class="row" style="margin-top:12px"><button class="pri" data-act="impGo">Open in editor</button><button data-act="close">Cancel</button><span class="small" id="impMsg"></span></div>`);
      $("#impFile").addEventListener("change",ev=>{const f=ev.target.files[0];if(!f)return;f.text().then(t=>{$("#impTxt").value=t})});return;
    case "impGo":{const err=importAdv($("#impTxt").value);if(err)$("#impMsg").textContent=err;return}
    case "close":case "closeBg":return closeModal();
  }
});
document.addEventListener("change",e=>{if(e.target.id!=="diff")return;ps().difficulty=e.target.value;saveStats();const n=$("#diffNote");if(n)n.textContent=DIFF[diffKey()].note});
$("#player").addEventListener("change",e=>{
  if(e.target.value==="__add"){renderPlayers();modal(`<h3>Add a player</h3><label for="pn">Name</label><input id="pn" maxlength="24" autocomplete="off"><div class="row" style="margin-top:12px"><button class="pri" data-act="addP">Add</button><button data-act="close">Cancel</button></div>`);return}
  saveStats();cur=e.target.value;ls.set("ks-cur",cur);if(view==="play"&&!(G&&G.testing))return renderLibrary();if(view==="library")renderLibrary();
});
document.addEventListener("click",e=>{if(e.target.closest("[data-act=addP]")){const n=$("#pn").value.trim();if(n&&!players.includes(n)){players.push(n);ls.set("ks-players",players)}if(n){cur=n;ls.set("ks-cur",cur)}closeModal();renderPlayers();if(view==="library")renderLibrary()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").innerHTML)closeModal();if(e.key==="Enter"&&e.target.id==="pn")$("[data-act=addP]").click();if(e.key==="Enter"&&e.target.id==="ek")$("[data-act=signInGo]").click()});

renderPlayers();renderLibrary();loadAdventures().then(()=>{if(view==="library")renderLibrary()});
}
</script>
</body>
</html>
